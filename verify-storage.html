<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageManager Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .demo-section {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .demo-section h2 {
            margin-top: 0;
            color: #667eea;
            font-size: 18px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
        .info {
            color: #60a5fa;
        }
        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 5px;
            font-family: inherit;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.available {
            background: #d1fae5;
            color: #065f46;
        }
        .status.unavailable {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StorageManager Module Verification</h1>
        <p class="subtitle">Interactive demo of the StorageManager module's functionality</p>
        
        <!-- Status Check -->
        <div class="demo-section">
            <h2>1. Storage Availability Check</h2>
            <button onclick="checkAvailability()">Check if Local Storage is Available</button>
            <div id="availability-output" class="output"></div>
        </div>
        
        <!-- String Storage -->
        <div class="demo-section">
            <h2>2. String Storage (getItem / setItem)</h2>
            <input type="text" id="string-key" placeholder="Key (e.g., 'user_name')" value="user_name">
            <input type="text" id="string-value" placeholder="Value (e.g., 'John Doe')" value="John Doe">
            <button onclick="setString()">Set String</button>
            <button onclick="getString()">Get String</button>
            <button onclick="removeString()">Remove String</button>
            <div id="string-output" class="output"></div>
        </div>
        
        <!-- Object Storage -->
        <div class="demo-section">
            <h2>3. Object Storage (getObject / setObject)</h2>
            <button onclick="setTasksExample()">Store Tasks Array</button>
            <button onclick="getTasksExample()">Retrieve Tasks Array</button>
            <button onclick="setUserProfile()">Store User Profile Object</button>
            <button onclick="getUserProfile()">Retrieve User Profile</button>
            <div id="object-output" class="output"></div>
        </div>
        
        <!-- Error Handling -->
        <div class="demo-section">
            <h2>4. Error Handling Demonstration</h2>
            <button onclick="testInvalidJSON()">Test Invalid JSON Handling</button>
            <button onclick="testMissingKey()">Test Missing Key with Default</button>
            <div id="error-output" class="output"></div>
        </div>
        
        <!-- View All Storage -->
        <div class="demo-section">
            <h2>5. View All Dashboard Data</h2>
            <button onclick="viewAllStorage()">View All Stored Data</button>
            <button onclick="clearAllStorage()">Clear All Dashboard Data</button>
            <div id="view-output" class="output"></div>
        </div>
    </div>
    
    <!-- Load StorageManager -->
    <script src="app.js"></script>
    
    <!-- Demo Scripts -->
    <script>
        function log(elementId, message, type = 'info') {
            const output = document.getElementById(elementId);
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            output.innerHTML += `<div class="${className}">${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }
        
        function clearOutput(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }
        
        // 1. Availability Check
        function checkAvailability() {
            clearOutput('availability-output');
            const available = StorageManager.isAvailable();
            if (available) {
                log('availability-output', '✓ Local Storage is AVAILABLE', 'success');
                log('availability-output', 'Status: <span class="status available">READY</span>');
            } else {
                log('availability-output', '✗ Local Storage is NOT AVAILABLE', 'error');
                log('availability-output', 'Status: <span class="status unavailable">UNAVAILABLE</span>');
            }
        }
        
        // 2. String Operations
        function setString() {
            clearOutput('string-output');
            const key = document.getElementById('string-key').value;
            const value = document.getElementById('string-value').value;
            
            if (!key || !value) {
                log('string-output', '✗ Please provide both key and value', 'error');
                return;
            }
            
            const success = StorageManager.setItem(key, value);
            if (success) {
                log('string-output', `✓ Stored: "${key}" = "${value}"`, 'success');
            } else {
                log('string-output', '✗ Failed to store value', 'error');
            }
        }
        
        function getString() {
            clearOutput('string-output');
            const key = document.getElementById('string-key').value;
            
            if (!key) {
                log('string-output', '✗ Please provide a key', 'error');
                return;
            }
            
            const value = StorageManager.getItem(key, 'NOT_FOUND');
            if (value !== 'NOT_FOUND') {
                log('string-output', `✓ Retrieved: "${key}" = "${value}"`, 'success');
            } else {
                log('string-output', `✗ Key "${key}" not found`, 'error');
            }
        }
        
        function removeString() {
            clearOutput('string-output');
            const key = document.getElementById('string-key').value;
            
            if (!key) {
                log('string-output', '✗ Please provide a key', 'error');
                return;
            }
            
            const success = StorageManager.removeItem(key);
            if (success) {
                log('string-output', `✓ Removed: "${key}"`, 'success');
            } else {
                log('string-output', '✗ Failed to remove key', 'error');
            }
        }
        
        // 3. Object Operations
        function setTasksExample() {
            clearOutput('object-output');
            const tasks = [
                { id: '1', text: 'Complete project', completed: false, createdAt: Date.now() },
                { id: '2', text: 'Review code', completed: true, createdAt: Date.now() },
                { id: '3', text: 'Write documentation', completed: false, createdAt: Date.now() }
            ];
            
            const success = StorageManager.setObject('tasks', tasks);
            if (success) {
                log('object-output', '✓ Stored tasks array:', 'success');
                log('object-output', JSON.stringify(tasks, null, 2));
            } else {
                log('object-output', '✗ Failed to store tasks', 'error');
            }
        }
        
        function getTasksExample() {
            clearOutput('object-output');
            const tasks = StorageManager.getObject('tasks', []);
            
            if (tasks.length > 0) {
                log('object-output', `✓ Retrieved ${tasks.length} tasks:`, 'success');
                log('object-output', JSON.stringify(tasks, null, 2));
            } else {
                log('object-output', '✗ No tasks found (store some first)', 'error');
            }
        }
        
        function setUserProfile() {
            clearOutput('object-output');
            const profile = {
                name: 'Jane Smith',
                theme: 'dark',
                timerDuration: 25,
                lastLogin: new Date().toISOString()
            };
            
            const success = StorageManager.setObject('user_profile', profile);
            if (success) {
                log('object-output', '✓ Stored user profile:', 'success');
                log('object-output', JSON.stringify(profile, null, 2));
            } else {
                log('object-output', '✗ Failed to store profile', 'error');
            }
        }
        
        function getUserProfile() {
            clearOutput('object-output');
            const profile = StorageManager.getObject('user_profile', null);
            
            if (profile) {
                log('object-output', '✓ Retrieved user profile:', 'success');
                log('object-output', JSON.stringify(profile, null, 2));
            } else {
                log('object-output', '✗ No profile found (store one first)', 'error');
            }
        }
        
        // 4. Error Handling
        function testInvalidJSON() {
            clearOutput('error-output');
            log('error-output', 'Testing invalid JSON handling...', 'info');
            
            // Manually insert invalid JSON
            localStorage.setItem('dashboard_invalid_json', '{invalid: json}');
            
            // Try to retrieve it
            const result = StorageManager.getObject('invalid_json', { fallback: true });
            
            if (result.fallback === true) {
                log('error-output', '✓ Invalid JSON handled gracefully', 'success');
                log('error-output', '✓ Default value returned correctly', 'success');
            } else {
                log('error-output', '✗ Error handling failed', 'error');
            }
        }
        
        function testMissingKey() {
            clearOutput('error-output');
            log('error-output', 'Testing missing key with default value...', 'info');
            
            const defaultValue = { message: 'This is the default' };
            const result = StorageManager.getObject('nonexistent_key_12345', defaultValue);
            
            if (result.message === 'This is the default') {
                log('error-output', '✓ Missing key handled gracefully', 'success');
                log('error-output', '✓ Default value returned correctly', 'success');
            } else {
                log('error-output', '✗ Error handling failed', 'error');
            }
        }
        
        // 5. View All
        function viewAllStorage() {
            clearOutput('view-output');
            log('view-output', 'Dashboard data in Local Storage:', 'info');
            log('view-output', '─'.repeat(50));
            
            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dashboard_')) {
                    const shortKey = key.replace('dashboard_', '');
                    const value = localStorage.getItem(key);
                    count++;
                    
                    log('view-output', `\nKey: ${shortKey}`);
                    try {
                        const parsed = JSON.parse(value);
                        log('view-output', `Value: ${JSON.stringify(parsed, null, 2)}`);
                    } catch {
                        log('view-output', `Value: "${value}"`);
                    }
                }
            }
            
            log('view-output', '─'.repeat(50));
            log('view-output', `Total items: ${count}`, count > 0 ? 'success' : 'info');
        }
        
        function clearAllStorage() {
            clearOutput('view-output');
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dashboard_')) {
                    keys.push(key);
                }
            }
            
            keys.forEach(key => localStorage.removeItem(key));
            log('view-output', `✓ Cleared ${keys.length} dashboard items`, 'success');
        }
        
        // Auto-check availability on load
        window.addEventListener('DOMContentLoaded', checkAvailability);
    </script>
</body>
</html>
